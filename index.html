<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色展示 Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>角色展示 Demo</h1>
    </header>

    <main>
        <section class="character-gallery">
            <h2>角色合集</h2>
            <div class="gallery-container">
                <div class="character-card">
                    <img src="https://via.placeholder.com/150" alt="角色图片1">
                    <p>角色名称 1</p>
                </div>
                <div class="character-card">
                    <img src="https://via.placeholder.com/150" alt="角色图片2">
                    <p>角色名称 2</p>
                </div>
                <div class="character-card">
                    <img src="https://via.placeholder.com/150" alt="角色图片3">
                    <p>角色名称 3</p>
                </div>
            </div>
        </section>

        <section class="description">
            <h2>项目说明</h2>
            <p>这是一个用于演示前端网页基本结构的 Demo。您可以根据需要替换图片和文本内容。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 您的项目</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
